<!-- Horizontal logo with text for headers/marketing -->
<svg width="400" height="100" viewBox="0 0 400 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo circle -->
  <circle cx="50" cy="50" r="45" fill="#000000"/>

  <!-- Rolling door segments -->
  <g transform="translate(25, 28)">
    <rect x="0" y="0" width="50" height="6" rx="1.5" fill="#ffffff" opacity="0.95"/>
    <rect x="0" y="8" width="50" height="6" rx="1.5" fill="#ffffff" opacity="0.85"/>
    <rect x="0" y="16" width="50" height="6" rx="1.5" fill="#ffffff" opacity="0.75"/>
    <rect x="0" y="24" width="50" height="6" rx="1.5" fill="#ffffff" opacity="0.65"/>
    <rect x="0" y="32" width="50" height="6" rx="1.5" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- Motion arc -->
  <circle cx="50" cy="50" r="35" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.2"/>
  <path d="M 50 15 A 35 35 0 0 1 72.5 27.5" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Text: ROLLWISE -->
  <text x="115" y="60" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" fill="#000000" letter-spacing="-0.02em">
    ROLLWISE
  </text>
</svg>

